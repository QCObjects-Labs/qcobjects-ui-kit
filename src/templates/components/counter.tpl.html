<style>
.kit-counter {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  border: 1px solid #334155;
  background: #1e293b;
  border-radius: 12px;
  padding: 12px 16px;
}
.kit-count {
  min-width: 3ch;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #fb923c;
}
.kit-counter button {
  appearance: none;
  border: 0;
  border-radius: 8px;
  width: 34px;
  height: 34px;
  font-size: 18px;
  cursor: pointer;
  background: #0ea5e9;
  color: #0f172a;
}
.kit-counter button:hover {
  background: #38bdf8;
}
</style>
<section class="kit-counter">
  <button type="button" data-action="dec" aria-label="decrement">&minus;</button>
  <span class="kit-count" data-count>{{count}}</span>
  <button type="button" data-action="inc" aria-label="increment">&plus;</button>
</section>
