<style>
  @import url("css/components/counter.css");
</style>
<section class="inline-flex items-center gap-3 rounded-xl border border-slate-700 bg-slate-800 px-4 py-3">
  <button type="button" data-action="dec" aria-label="decrement"
    class="h-9 w-9 cursor-pointer rounded-lg bg-sky-500 text-base font-bold text-slate-900 transition-colors hover:bg-sky-400">&minus;</button>
  <span class="kit-count text-xl font-bold text-orange-400">{{count}}</span>
  <button type="button" data-action="inc" aria-label="increment"
    class="h-9 w-9 cursor-pointer rounded-lg bg-sky-500 text-base font-bold text-slate-900 transition-colors hover:bg-sky-400">&plus;</button>
</section>
